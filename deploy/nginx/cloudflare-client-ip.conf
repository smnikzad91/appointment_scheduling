# Real client IP behind Cloudflare, for dev-iot.ir — REFERENCE COPY.
#
# ALREADY APPLIED on the dev-iot.ir server: these geo/map/log_format blocks are inline at the top
# of /etc/nginx/sites-available/dev-iot.ir, and its HTTPS server uses $client_ip for X-Real-IP /
# X-Forwarded-For and `access_log /var/log/nginx/dev-iot.ir.access.log cf_client;`.
# Do NOT also copy this file into /etc/nginx/conf.d/: the second definition breaks `nginx -t`
# (duplicate "log_format" name "cf_client" / duplicate geo variable). To change the ranges or the
# logic, edit the inline copy in the vhost (and mirror it here), then `nginx -t && systemctl reload
# nginx`.
#
# On a new server, pick exactly one place: paste these blocks at the top of the site file (as on
# dev-iot.ir), or put this file in /etc/nginx/conf.d/ — then in the HTTPS server block use
#
#   proxy_set_header X-Real-IP       $client_ip;
#   proxy_set_header X-Forwarded-For $client_ip;
#   access_log /var/log/nginx/dev-iot.ir.access.log cf_client;
#
# instead of `$remote_addr` / `$proxy_add_x_forwarded_for`, and `nginx -t` before reloading.
#
# How it works: the vhost sits behind the stream SNI router, so $remote_addr is always 127.0.0.1;
# whoever really connected to :443 — a Cloudflare edge, or someone hitting the server's IP
# directly — is $proxy_protocol_addr. CF-Connecting-IP is trusted *only* when that address is one of
# Cloudflare's (anyone else could put any IP in that header); otherwise the connecting address
# itself is the client. X-Forwarded-For is overwritten, not appended to, so a client can't
# prepend a fake entry (apps/web reads its first entry). No realip module is needed.
#
# Cloudflare's ranges change rarely; compare with https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6 now and then (list below as of 2026).

geo $proxy_protocol_addr $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# The visitor's IP: Cloudflare's CF-Connecting-IP when the connection came from Cloudflare (and it
# sent one), else the connecting address itself.
map "$from_cloudflare:$http_cf_connecting_ip" $client_ip {
    default    $proxy_protocol_addr;
    "~^1:(.+)$" $1;
}

log_format cf_client '$client_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" edge=$proxy_protocol_addr';
