# Real client IP behind Cloudflare, for dev-iot.ir. Install (as root):
#
#   cp deploy/nginx/cloudflare-client-ip.conf /etc/nginx/conf.d/cloudflare-client-ip.conf
#
# conf.d/*.conf is included in the `http {}` block (Debian/Ubuntu default), which is where geo/map/
# log_format must live. Then, in /etc/nginx/sites-available/dev-iot.ir, inside the HTTPS server
# (the `listen 127.0.0.1:8444 ssl proxy_protocol` one) — keep its existing
# `set_real_ip_from 127.0.0.1; real_ip_header proxy_protocol;` lines as they are — add:
#
#   access_log /var/log/nginx/dev-iot.ir.access.log cf_client;
#
# and in every `location` that proxies to the apps (web and /backend/), replace any existing
# X-Real-IP / X-Forwarded-For lines with:
#
#   proxy_set_header X-Real-IP       $client_ip;
#   proxy_set_header X-Forwarded-For $client_ip;
#
# then `nginx -t && systemctl reload nginx`.
#
# Why not simply `real_ip_header CF-Connecting-IP`: a server can have only one real_ip_header, and
# this vhost needs proxy_protocol for the SNI router in front of it (without it every client would
# be 127.0.0.1). After that step $remote_addr is whoever connected to :443 — a Cloudflare edge, or
# someone hitting the server's IP directly. CF-Connecting-IP is trusted *only* when that address is
# one of Cloudflare's; anyone else could put any IP in that header. Otherwise $remote_addr is used.
#
# Cloudflare's ranges change rarely; compare with https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6 now and then (list below as of 2026).

geo $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# The visitor's IP: Cloudflare's CF-Connecting-IP when the connection came from Cloudflare (and it
# sent one), else the connecting address itself.
map "$from_cloudflare:$http_cf_connecting_ip" $client_ip {
    default    $remote_addr;
    "~^1:(.+)$" $1;
}

log_format cf_client '$client_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" edge=$remote_addr';
