<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<title>اتصال برقرار نیست — نوبتت</title>
<style>
  @font-face { font-family: V; src: url(/fonts/Vazirmatn-Variable.woff2) format("woff2"); font-weight: 100 900; }
  :root { color-scheme: light dark; --bg: #f6efe6; --ink: #2a1d26; --muted: #7b6b71; --accent: #a34a30; }
  @media (prefers-color-scheme: dark) { :root { --bg: #19121a; --ink: #f4ebe2; --muted: #b1a1a6; --accent: #e07f58; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: V, Tahoma, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
         padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; box-sizing: border-box; }
  .arch { width: 96px; height: 120px; border: 8px solid var(--accent); border-bottom: 0; border-radius: 96px 96px 0 0; opacity: .35; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.9; max-width: 280px; }
  button { margin-top: 12px; border: 0; border-radius: 16px; background: var(--accent); color: #fffaf5; font: 700 15px V, Tahoma, sans-serif;
           height: 48px; padding: 0 28px; }
</style>
</head>
<body>
<main>
  <div class="arch" aria-hidden="true"></div>
  <h1>اتصال به اینترنت برقرار نیست</h1>
  <p>به محض وصل شدن دوباره، نوبت‌ها و اطلاعات شما به‌روز می‌شوند.</p>
  <button type="button" onclick="location.reload()">تلاش دوباره</button>
</main>
</body>
</html>
