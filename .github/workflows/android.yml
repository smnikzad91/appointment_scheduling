# Builds the Android app (apps/android) on every push to its branch and keeps the APK as a
# downloadable artifact (Actions → this run → Artifacts). No Android SDK on the server, so this is
# where it's compiled. Debug build: install it to try it, don't publish it.
name: Android

on:
  push:
    branches: [android-app]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # The release key, when the repo has the secrets (base64 keystore + passwords); else unsigned.
      - name: Release key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NOBATET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NOBATET_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK, release APK + bundle
        shell: bash
        env:
          NOBATET_VERSION_CODE: ${{ github.run_number }}
          NOBATET_KEYSTORE_PASSWORD: ${{ secrets.NOBATET_KEYSTORE_PASSWORD }}
          NOBATET_KEY_ALIAS: ${{ secrets.NOBATET_KEY_ALIAS }}
          NOBATET_KEY_PASSWORD: ${{ secrets.NOBATET_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease bundleRelease --stacktrace 2>&1 | tee build.log
      # Compiler errors as annotations (readable on the run page without signing in to the logs).
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//$'\r'/}"
          done
      # The signing certificates' SHA-256 (public, not secret) as notices on the run page: the
      # release one goes into ANDROID_CERT_SHA256 (apps/web/.env.production) for app links.
      - name: Signing certificate fingerprints
        shell: bash
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            sha=$("$signer" verify --print-certs "$apk" 2>/dev/null | grep -m1 "SHA-256 digest" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
            [ -n "$sha" ] && echo "::notice title=$(basename "$apk") SHA-256::$sha" && echo "- \`$(basename "$apk")\`: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nobatet-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nobatet-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
