# Builds the Android app (apps/android) on every push to its branch and keeps the APK as a
# downloadable artifact (Actions → this run → Artifacts). No Android SDK on the server, so this is
# where it's compiled. Debug build: install it to try it, don't publish it.
name: Android

on:
  push:
    branches: [android-app]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      # The release key, when the repo has the secrets (base64 keystore + passwords); else unsigned.
      - name: Release key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NOBATET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NOBATET_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      # Flavors (app/build.gradle.kts): `direct` = the APK on nobatet.app (in-app updates),
      # `bazaar` / `myket` = the store builds (no self-update, no install permission).
      - name: Build direct debug APK, release APKs + store bundles, update tests
        shell: bash
        env:
          NOBATET_VERSION_CODE: ${{ github.run_number }}
          NOBATET_KEYSTORE_PASSWORD: ${{ secrets.NOBATET_KEYSTORE_PASSWORD }}
          NOBATET_KEY_ALIAS: ${{ secrets.NOBATET_KEY_ALIAS }}
          NOBATET_KEY_PASSWORD: ${{ secrets.NOBATET_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDirectDebug assembleRelease bundleBazaarRelease bundleMyketRelease \
            testDirectDebugUnitTest --tests 'app.nobatet.update.*' --stacktrace 2>&1 | tee build.log
      # One clearly named file per channel: nobatet-<flavor>-<run number>[-unsigned].apk / .aab, plus
      # SHA256SUMS. The direct APK is what gets uploaded at nobatet.app/admin/app-releases.
      - name: Collect release files
        shell: bash
        env:
          CODE: ${{ github.run_number }}
        run: |
          set -e
          mkdir -p dist
          for f in direct bazaar myket; do
            apk=$(ls app/build/outputs/apk/$f/release/*.apk | head -1)
            suffix=""; [[ "$apk" == *unsigned* ]] && suffix="-unsigned"
            cp "$apk" "dist/nobatet-$f-$CODE$suffix.apk"
          done
          for f in bazaar myket; do
            cp app/build/outputs/bundle/${f}Release/*.aab "dist/nobatet-$f-$CODE.aab"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      # Compiler errors as annotations (readable on the run page without signing in to the logs).
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//$'\r'/}"
          done
      # The signing certificates' SHA-256 (public, not secret) as notices on the run page: the
      # release one goes into ANDROID_CERT_SHA256 (apps/web/.env.production) for app links.
      # An unsigned APK (no keystore secrets) is reported as such, not an error.
      - name: Signing certificate fingerprints
        continue-on-error: true
        shell: bash {0}
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk app/build/outputs/apk/direct/debug/*.apk; do
            [ -f "$apk" ] || continue
            sha=$("$signer" verify --print-certs "$apk" 2>/dev/null | grep -m1 "SHA-256 digest" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
            if [ -n "$sha" ]; then msg="$sha"; else msg="unsigned (no NOBATET_KEYSTORE_* secrets in the repo)"; fi
            echo "::notice title=$(basename "$apk") SHA-256::$msg"
            echo "- \`$(basename "$apk")\`: \`$msg\`" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: nobatet-debug-apk
          path: apps/android/app/build/outputs/apk/direct/debug/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: nobatet-release
          path: apps/android/dist/*
